    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@63be653774a6a83cd8e475a7b65f1ed68b9a0093/IconSet/Color/Static.png"
    include-all: true
    exclude-filter: &exclude-notice '(?i)(剩余|官网|套餐|流量|到期|过期|更新|刷新|订阅|群|网址|客服|欢迎|加入|Expire|Traffic|Reset|(^|[^A-Za-z0-9])(\d+(\.\d+)?\s*(GB|TB)|\d+\s*Days?)([^A-Za-z0-9]|$))'

