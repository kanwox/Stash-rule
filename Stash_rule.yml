#proxy-providers: {"订阅": {type: http, url: "这里填写订阅链接", interval: 86400, health-check: {enable: true, url: "https://www.gstatic.com/generate_204", interval: 600}}}

name: "Clash Rule for Stash"
desc: "模块模式保留首行；完整配置模式删除首行唯一的注释号并替换订阅链接占位文字；首次启动需联网下载规则集。"

mode: rule
log-level: warning
ipv6: true

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: "198.18.0.1/16"
  use-hosts: true
  default-nameserver: ["223.5.5.5", "119.29.29.29"]
  nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://doh.pub/dns-query"
  fallback:
    - "https://1.1.1.1/dns-query"
    - "https://8.8.8.8/dns-query"
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr: ["0.0.0.0/8", "127.0.0.0/8", "240.0.0.0/4"]
    domain:
      - "+.openai.com"
      - "+.chatgpt.com"
      - "+.oaistatic.com"
      - "+.oaiusercontent.com"
      - "+.github.com"
      - "+.githubusercontent.com"
      - "+.google.com"
      - "+.googleapis.com"
      - "+.youtube.com"
      - "+.telegram.org"
      - "+.t.me"
      - "+.tiktok.com"
      - "+.twitter.com"
      - "+.x.com"
      - "+.netflix.com"
      - "+.twitch.tv"
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost"
    - "localhost.ptlogin2.qq.com"
    - "time.windows.com"
    - "time.apple.com"
    - "time.*.com"
    - "ntp.*.com"
    - "*.ntp.org"
    - "pool.ntp.org"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "xboxlive.com"
    - "*.xboxlive.com"
    - "xbox.com"
    - "*.xbox.com"
    - "xbox.ipv6.microsoft.com"
    - "playstation.net"
    - "*.playstation.net"
    - "*.srv.nintendo.net"
    - "stun.*"
    - "stun.*.*"
    - "stun.*.*.*"
    - "stun.*.*.*.*"

