proxy-groups:
  - name: "主代理"
    type: select
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@63be653774a6a83cd8e475a7b65f1ed68b9a0093/IconSet/Color/Proxy.png"
    proxies: ["HK", "JP", "TW", "SG", "US", "静态", "直连"]

  - name: "静态"
    type: select
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@63be653774a6a83cd8e475a7b65f1ed68b9a0093/IconSet/Color/Static.png"
    include-all: true
    exclude-filter: &exclude '(?i)(剩余|官网|套餐|流量|到期|过期|更新|刷新|订阅|群|网址|客服|欢迎|加入|Expire|Traffic|Reset|(^|[^A-Za-z0-9])(\d+(\.\d+)?\s*(GB|TB)|\d+\s*Days?)([^A-Za-z0-9]|$))'

  - {name: "AI", type: select, icon: "https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/openai.png", proxies: ["主代理", "直连", "HK", "JP", "TW", "SG", "US"], include-all: true, exclude-filter: *exclude}
  - {name: "Apple", type: select, icon: "https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/apple.png", proxies: ["主代理", "直连", "HK", "JP", "TW", "SG", "US"], include-all: true, exclude-filter: *exclude}
  - {name: "GitHub", type: select, icon: "https://i.postimg.cc/vTSTYrLQ/github.png", proxies: ["主代理", "直连", "HK", "JP", "TW", "SG", "US"], include-all: true, exclude-filter: *exclude}
  - {name: "Google", type: select, icon: "https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/google.png", proxies: ["主代理", "直连", "HK", "JP", "TW", "SG", "US"], include-all: true, exclude-filter: *exclude}
  - {name: "Microsoft", type: select, icon: "https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/microsoft.png", proxies: ["主代理", "直连", "HK", "JP", "TW", "SG", "US"], include-all: true, exclude-filter: *exclude}
  - {name: "Telegram", type: select, icon: "https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/telegram.png", proxies: ["主代理", "直连", "HK", "JP", "TW", "SG", "US"], include-all: true, exclude-filter: *exclude}
  - {name: "TikTok", type: select, icon: "https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/tiktok.png", proxies: ["主代理", "直连", "HK", "JP", "TW", "SG", "US"], include-all: true, exclude-filter: *exclude}
  - {name: "TV", type: select, icon: "https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/netflix.png", proxies: ["主代理", "直连", "HK", "JP", "TW", "SG", "US"], include-all: true, exclude-filter: *exclude}
  - {name: "Twitch", type: select, icon: "https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/twitch.png", proxies: ["主代理", "直连", "HK", "JP", "TW", "SG", "US"], include-all: true, exclude-filter: *exclude}
  - {name: "X", type: select, icon: "https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/x.png", proxies: ["主代理", "直连", "HK", "JP", "TW", "SG", "US"], include-all: true, exclude-filter: *exclude}
  - {name: "YouTube", type: select, icon: "https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/youtube.png", proxies: ["主代理", "直连", "HK", "JP", "TW", "SG", "US"], include-all: true, exclude-filter: *exclude}

  - name: "HK"
    type: url-test
    hidden: true
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@63be653774a6a83cd8e475a7b65f1ed68b9a0093/IconSet/Color/Hong_Kong.png"
    include-all: true
    filter: '(?i)(香港|🇭🇰|(^|[^A-Za-z])HK([^A-Za-z]|$)|(^|[^A-Za-z])HKG([^A-Za-z]|$)|Hong[ -]?Kong)'
    exclude-filter: *exclude
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 30

  - name: "JP"
    type: url-test
    hidden: true
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@63be653774a6a83cd8e475a7b65f1ed68b9a0093/IconSet/Color/Japan.png"
    include-all: true
    filter: '(?i)(日本|东京|東京|大阪|🇯🇵|(^|[^A-Za-z])JP([^A-Za-z]|$)|(^|[^A-Za-z])JPN([^A-Za-z]|$)|Japan)'
    exclude-filter: *exclude
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 30

  - name: "TW"
    type: url-test
    hidden: true
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@63be653774a6a83cd8e475a7b65f1ed68b9a0093/IconSet/Color/Taiwan.png"
    include-all: true
    filter: '(?i)(台湾|台灣|台北|新北|🇹🇼|(^|[^A-Za-z])TW([^A-Za-z]|$)|(^|[^A-Za-z])TWN([^A-Za-z]|$)|Taiwan)'
    exclude-filter: *exclude
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 30

  - name: "SG"
    type: url-test
    hidden: true
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@63be653774a6a83cd8e475a7b65f1ed68b9a0093/IconSet/Color/Singapore.png"
    include-all: true
    filter: '(?i)(新加坡|狮城|獅城|🇸🇬|(^|[^A-Za-z])SG([^A-Za-z]|$)|(^|[^A-Za-z])SGP([^A-Za-z]|$)|Singapore)'
    exclude-filter: *exclude
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 30

  - name: "US"
    type: url-test
    hidden: true
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@63be653774a6a83cd8e475a7b65f1ed68b9a0093/IconSet/Color/United_States.png"
    include-all: true
    filter: '(?i)(美国|美國|洛杉矶|洛杉磯|圣何塞|聖何塞|硅谷|矽谷|西雅图|西雅圖|纽约|紐約|🇺🇸|(^|[^A-Za-z])US([^A-Za-z]|$)|(^|[^A-Za-z])USA([^A-Za-z]|$)|United[ -]?States)'
    exclude-filter: *exclude
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 30

  - name: "直连"
    type: select
    hidden: true
    icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@63be653774a6a83cd8e475a7b65f1ed68b9a0093/IconSet/Color/Direct.png"
    proxies: ["DIRECT"]

rules:
  - "RULE-SET,private-domain,DIRECT"
  - "RULE-SET,private-ip,DIRECT,no-resolve"
  - "RULE-SET,ads-domain,REJECT"
  - "RULE-SET,youtube-domain,YouTube"
  - "RULE-SET,twitch-domain,Twitch"
  - "RULE-SET,twitter-domain,X"
  - "RULE-SET,tiktok-domain,TikTok"
  - "RULE-SET,telegram-domain,Telegram"
  - "RULE-SET,telegram-ip,Telegram,no-resolve"
  - "RULE-SET,ai-domain,AI"
  - "RULE-SET,github-domain,GitHub"
  - "RULE-SET,netflix-domain,TV"
  - "RULE-SET,disney-domain,TV"
  - "RULE-SET,primevideo-domain,TV"
  - "RULE-SET,appletv-domain,TV"
  - "RULE-SET,hbo-domain,TV"
  - "RULE-SET,google-domain,Google"
  - "RULE-SET,apple-domain,Apple"
  - "RULE-SET,microsoft-domain,Microsoft"
  - "RULE-SET,cn-domain,DIRECT"
  - "RULE-SET,cn-ip,DIRECT,no-resolve"
  - "MATCH,主代理"