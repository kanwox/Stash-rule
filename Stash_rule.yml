# ============================================================
# Clash_rule.js v5.2 的 Stash 迁移版
# 要求：Stash iOS ≥ 3.1.0（MRS 规则集）/ macOS ≥ 对应版本；
#       proxy-server-nameserver 需 iOS ≥ 3.6 / macOS ≥ 4.3
# 说明：Stash 自动嗅探 TLS SNI / QUIC / HTTP Host 还原域名参与分流，
#       无需也无法配置 mihomo 式 sniffer 段。
#       若某地区组内无匹配节点，该组会按 DIRECT 处理（泄漏风险），
#       请按自己机场实际地区删减下方地区组及各 proxies 引用。
# ============================================================
name: "Slash_rule 全功能分流"
desc: >-
  由 Mihomo 复写脚本 v5.2 转换：AI/流媒体/GitHub/Telegram 等应用分组 +
  23 地区测速组 + 国内直连 + 广告拦截 + DNS 分流。
  空地区组会回退 DIRECT，不用的地区请自行删减。

# ---- 基础设置（简单类型直接覆盖订阅值）----
mode: rule
log-level: warning

# ---- DNS ----
# Stash 内置 DNS 恒为 fake-ip 工作方式，无 enable/enhanced-mode/listen 键；
# 国际域名由远端节点解析，本地解析仅服务直连与 IP 判定，
# 故采用官方推荐的国内 DoH 直连，不再复刻 mihomo 的“DNS 走隧道”设计。
dns:
  # 引导 DNS：仅用于解析其它 DoH 服务器的域名，必须纯 IP
  default-nameserver: #!replace
    - 223.5.5.5
    - 119.29.29.29
  # 主解析：国内 DoH 直连（替代原 1.1.1.1/8.8.8.8#主代理 方案）
  nameserver: #!replace
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  # 代理节点域名专用解析，独立查询路径、不走代理规则，避免递归
  proxy-server-nameserver: #!replace
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  # 字典递归合并：订阅自带 policy 会保留，此处仅追加/覆盖
  nameserver-policy:
    'geosite:private':
      - system
    'geosite:cn':
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
  # 数组前插合并：与订阅自带豁免清单取并集（Stash 不支持 rule-set:/geosite: 引用，仅静态通配）
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - 'localhost.ptlogin2.qq.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - '+.ntp.org'
    - '+.xboxlive.com'
    - '+.playstation.net'
    - '+.xbox.com'
    - 'xbox.ipv6.microsoft.com'
    - '+.srv.nintendo.net'
    # 系统对时域名，拿假地址会导致对时失败进而影响 TLS 校验
    - 'time.windows.com'
    - 'time.apple.com'
    # STUN 通配兜底
    - '+.stun.*'
    - '+.stun.*.*'
    - '+.stun.*.*.*'
    - '+.stun.*.*.*.*'
    - '+.stun.*.*.*.*.*'

# ---- 远程规则集（MetaCubeX 官方拆分库，全 mrs）----
