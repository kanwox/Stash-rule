name: "Clash Rule - Stash"
desc: "Stash 纯覆写版；固定生成 HK、JP、TW、SG、US 五个地区组。"
icon: "https://testingcf.jsdelivr.net/gh/Koolson/Qure@63be653774a6a83cd8e475a7b65f1ed68b9a0093/IconSet/Color/Proxy.png"

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: "198.18.0.1/16"
  use-hosts: true
  default-nameserver:
    - "223.5.5.5"
    - "119.29.29.29"
  nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://doh.pub/dns-query"
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost"
    - "localhost.ptlogin2.qq.com"
    - "time.windows.com"
    - "time.apple.com"
    - "*.ntp.org"
    - "pool.ntp.org"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "*.xboxlive.com"
    - "*.xbox.com"
    - "xbox.ipv6.microsoft.com"
    - "*.playstation.net"
    - "*.srv.nintendo.net"
    - "stun.*"
    - "stun.*.*"
    - "stun.*.*.*"
    - "stun.*.*.*.*"

rule-providers:
  private-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.yaml", interval: 2592000}
  ads-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.yaml", interval: 604800}
  youtube-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/youtube.yaml", interval: 2592000}
  twitch-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/twitch.yaml", interval: 2592000}
  twitter-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/twitter.yaml", interval: 2592000}
  tiktok-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/tiktok.yaml", interval: 2592000}
  telegram-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/telegram.yaml", interval: 2592000}
  github-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/github.yaml", interval: 2592000}
  ai-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ai-!cn.yaml", interval: 2592000}
  netflix-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/netflix.yaml", interval: 2592000}
  disney-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/disney.yaml", interval: 2592000}
  primevideo-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/primevideo.yaml", interval: 2592000}
  appletv-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/apple-tvplus.yaml", interval: 2592000}
  hbo-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/hbo.yaml", interval: 2592000}
  google-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/google.yaml", interval: 2592000}
  apple-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/apple.yaml", interval: 2592000}
  microsoft-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/microsoft.yaml", interval: 2592000}
  cn-domain: {type: http, behavior: domain, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.yaml", interval: 2592000}
  private-ip: {type: http, behavior: ipcidr, url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.yaml", interval: 2592000}
