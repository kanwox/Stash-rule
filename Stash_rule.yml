# ---- 策略组 ----
proxy-groups: #!replace
  # 主代理
  - name: 主代理
    type: select
    icon: 'https://testingcf.jsdelivr.net/gh/Koolson/Qure@63be653774a6a83cd8e475a7b65f1ed68b9a0093/IconSet/Color/Proxy.png'
    proxies:
      - HK
      - TW
      - JP
      - KR
      - SG
      - US
      - AE
      - AR
      - AU
      - BD
      - BR
      - CA
      - DE
      - FR
      - GB
      - ID
      - IN
      - MY
      - NL
      - PH
      - TH
      - TR
      - VN
      - 静态
      - 直连

  # 静态：全部节点手选
  - name: 静态
    type: select
    icon: 'https://testingcf.jsdelivr.net/gh/Koolson/Qure@63be653774a6a83cd8e475a7b65f1ed68b9a0093/IconSet/Color/Static.png'
    include-all: true

  # 直连（供各组选择“走直连”，并按国内 URL 测速）
  - name: 直连
    type: select
    icon: 'https://testingcf.jsdelivr.net/gh/Koolson/Qure@63be653774a6a83cd8e475a7b65f1ed68b9a0093/IconSet/Color/Direct.png'
    proxies:
      - DIRECT

  # App 策略组（如需在某 App 组内直接手选单个节点，可在 App 内自行补充）
  - name: AI
    type: select
    icon: 'https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/openai.png'
    proxies: &app-proxies
      - 主代理
      - 直连
      - HK
      - TW
      - JP
      - KR
      - SG
      - US
      - AE
      - AR
      - AU
      - BD
      - BR
      - CA
      - DE
      - FR
      - GB
      - ID
      - IN
      - MY
      - NL
      - PH
      - TH
      - TR
      - VN
  - name: Apple
    type: select
    icon: 'https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/apple.png'
    proxies: *app-proxies
  - name: GitHub
    type: select
    icon: 'https://i.postimg.cc/vTSTYrLQ/github.png'
    proxies: *app-proxies
  - name: Google
    type: select
    icon: 'https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/google.png'
    proxies: *app-proxies
  - name: Microsoft
    type: select
    icon: 'https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/microsoft.png'
    proxies: *app-proxies
  - name: Telegram
    type: select
    icon: 'https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/telegram.png'
    proxies: *app-proxies
  - name: TikTok
    type: select
    icon: 'https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/tiktok.png'
    proxies: *app-proxies
  - name: TV
    type: select
    icon: 'https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/netflix.png'
    proxies: *app-proxies
  - name: Twitch
    type: select
    icon: 'https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/twitch.png'
    proxies: *app-proxies
  - name: X
    type: select
    icon: 'https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/x.png'
    proxies: *app-proxies
  - name: YouTube
    type: select
    icon: 'https://testingcf.jsdelivr.net/gh/shindgew/WHATSINStash@main/icon/youtube.png'
    proxies: *app-proxies

  # ---- 地区测速组（无匹配节点时按 DIRECT 处理，不用请删除）----
  - name: HK
    type: url-test
    icon: 'https://testingcf.jsdelivr.net/gh/HatScripts/circle-flags@gh-pages/flags/hk.svg'
    include-all: true
    filter: '(?i)(香港|🇭🇰|(^|[^A-Za-z])HK([^A-Za-z]|$)|(^|[^A-Za-z])HKG([^A-Za-z]|$)|Hong[ -]?Kong)'
    url: 'https://www.gstatic.com/generate_204'
    interval: 300
    tolerance: 30
    lazy: true
  - name: TW
    type: url-test
    icon: 'https://testingcf.jsdelivr.net/gh/HatScripts/circle-flags@gh-pages/flags/tw.svg'
    include-all: true
    filter: '(?i)(台湾|台灣|台北|新北|🇹🇼|(^|[^A-Za-z])
